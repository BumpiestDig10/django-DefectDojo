---
services:
  nginx:
    environment:
      USE_TLS: 'true'
      GENERATE_TLS_CERTIFICATE: 'false'
    volumes:
      - ./ssl/defect.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./ssl/defect.key:/etc/nginx/ssl/nginx.key:ro
      - ./nginx/nginx_TLS.conf:/etc/nginx/nginx_TLS.conf:ro
  uwsgi:
    environment:
      DD_SECURE_PROXY_SSL_HEADER: 'HTTP_X_FORWARDED_PROTO,https'
      DD_SESSION_COOKIE_SECURE: 'true'
      DD_CSRF_COOKIE_SECURE: 'true'