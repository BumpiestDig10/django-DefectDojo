# This docker-compose.yml file  is fully functional to evaluate DefectDojo
# in your local environment.
#
# Although Docker Compose is one of the supported installation methods to
# deploy a containerized DefectDojo in a production environment, the
# docker-compose.yml file is not intended for production use without first
# customizing it to your particular situation.
#
# Images are pulled through registry.defectdojo.com (run by DefectDojo, Inc.) so that our images
# don't count against your Docker Hub rate limits. Each pull is logged: time, image, Docker
# client and IP address. The address is used to identify the organization or network, then
# deleted within three days. The rest of the record is kept for up to 13 months. We use these
# logs to see which organizations download DefectDojo, and we may reach out to them about our
# products or to ask for feedback.
# Prefer to pull from Docker Hub directly? Set DD_IMAGE_REGISTRY=docker.io (shell or .env).
# To opt out of contact or have your data removed, email compliance@defectdojo.com.
# Details: https://defectdojo.com/privacy-policy (section 1.4)
---
services:
  nginx:
    build:
      context: ./
      dockerfile: "Dockerfile.nginx-alpine"
    image: "${DD_IMAGE_REGISTRY}/defectdojo/defectdojo-nginx:${NGINX_VERSION}"
    depends_on:
      uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: "${NGINX_METRICS_ENABLED}"
      DD_UWSGI_HOST: "${DD_UWSGI_HOST}"
      DD_UWSGI_PORT: "${DD_UWSGI_PORT}"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    ports:
      - target: 8080
        published: ${DD_PORT}
        protocol: tcp
        mode: host
      - target: 8443
        published: ${DD_TLS_PORT}
        protocol: tcp
        mode: host
  uwsgi:
    build:
      context: ./
      dockerfile: "Dockerfile.django-${DEFECT_DOJO_OS}"
      target: release
    image: "${DD_IMAGE_REGISTRY}/defectdojo/defectdojo-django:${DJANGO_VERSION}"
    depends_on:
      initializer:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', '${DD_DATABASE_HOST}:${DD_DATABASE_PORT}', '-t', '30', '--', '/entrypoint-uwsgi.sh']
    environment:
      DD_DEBUG: 'False'
      DD_DJANGO_METRICS_ENABLED: "${DD_DJANGO_METRICS_ENABLED}"
      DD_ALLOWED_HOSTS: "${DD_ALLOWED_HOSTS}"
      DD_DATABASE_URL: ${DD_DATABASE_URL}
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL}
      DD_CACHE_URL: ${DD_CACHE_URL}
      DD_SECRET_KEY: "${DD_SECRET_KEY}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT}"
      DD_EMAIL_URL: ${DD_EMAIL_URL}
      DD_SITE_URL: ${DD_SITE_URL}
    volumes:
        - type: bind
          source: ./docker/extra_settings
          target: /app/docker/extra_settings
        - "defectdojo_media:${DD_MEDIA_ROOT}"
  celerybeat:
    image: "${DD_IMAGE_REGISTRY}/defectdojo/defectdojo-django:${DJANGO_VERSION}"
    depends_on:
      initializer:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', '${DD_DATABASE_HOST}:${DD_DATABASE_PORT}', '-t', '30', '--', '/entrypoint-celery-beat.sh']
    environment:
      DD_DATABASE_URL: ${DD_DATABASE_URL}
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL}
      DD_CACHE_URL: ${DD_CACHE_URL}
      DD_SECRET_KEY: "${DD_SECRET_KEY}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT}"
    volumes:
        - type: bind
          source: ./docker/extra_settings
          target: /app/docker/extra_settings
  celeryworker:
    image: "${DD_IMAGE_REGISTRY}/defectdojo/defectdojo-django:${DJANGO_VERSION}"
    depends_on:
      initializer:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', '${DD_DATABASE_HOST}:${DD_DATABASE_PORT}', '-t', '30', '--', '/entrypoint-celery-worker.sh']
    environment:
      DD_DATABASE_URL: ${DD_DATABASE_URL}
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL}
      DD_CACHE_URL: ${DD_CACHE_URL}
      DD_SECRET_KEY: "${DD_SECRET_KEY}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT}"
      DD_EMAIL_URL: ${DD_EMAIL_URL}
      DD_SITE_URL: ${DD_SITE_URL}
    volumes:
        - type: bind
          source: ./docker/extra_settings
          target: /app/docker/extra_settings
        - "defectdojo_media:${DD_MEDIA_ROOT}"
  initializer:
    image: "${DD_IMAGE_REGISTRY}/defectdojo/defectdojo-django:${DJANGO_VERSION}"
    entrypoint: ['/wait-for-it.sh', '${DD_DATABASE_HOST}:${DD_DATABASE_PORT}', '--', '/entrypoint-initializer.sh']
    environment:
      DD_DATABASE_URL: ${DD_DATABASE_URL}
      DD_ADMIN_USER: "${DD_ADMIN_USER}"
      DD_ADMIN_MAIL: "${DD_ADMIN_MAIL}"
      DD_ADMIN_FIRST_NAME: "${DD_ADMIN_FIRST_NAME}"
      DD_ADMIN_LAST_NAME: "${DD_ADMIN_LAST_NAME}"
      DD_INITIALIZE: "${DD_INITIALIZE}"
      DD_SECRET_KEY: "${DD_SECRET_KEY}"
      DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY}"
      DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT}"
    volumes:
        - type: bind
          source: ./docker/extra_settings
          target: /app/docker/extra_settings
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    volumes:
      # we keep using the redis volume as renaming is not possible and copying data over
      # would require steps during downtime or complex commands in the intializer
      - defectdojo_redis:/data
volumes:
  defectdojo_media: {}
  defectdojo_redis: {}
